<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porridge UI preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #6d6040; }
  #host { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="host"></div>
<script type="module">
// Stand-in for Cmajor's PatchConnection so the view can be developed in a plain browser.
class MockPatchConnection
{
    constructor()
    {
        this.params = new Map();
        this.paramListeners = [];
        this.state = new Map();
        this.stateListeners = [];
        this.endpointListeners = new Map();
        this.log = [];
    }
    addAllParameterListener (fn)    { this.paramListeners.push (fn); }
    removeAllParameterListener (fn) { this.paramListeners = this.paramListeners.filter (f => f !== fn); }
    requestParameterValue (id)      { if (this.params.has (id)) this.paramListeners.forEach (f => f ({ endpointID: id, value: this.params.get (id) })); }
    sendEventOrValue (id, value)
    {
        this.log.push ([id, value]);
        if (typeof value === "number" && this.params.get (id) !== value)
        {
            this.params.set (id, value);
            this.paramListeners.forEach (f => f ({ endpointID: id, value }));
        }
    }
    sendParameterGestureStart() {}
    sendParameterGestureEnd() {}
    addStoredStateValueListener (fn)    { this.stateListeners.push (fn); }
    removeStoredStateValueListener (fn) { this.stateListeners = this.stateListeners.filter (f => f !== fn); }
    requestStoredStateValue (key)
    {
        setTimeout (() =>
        {
            this.stateListeners.forEach (f => f ({ key, value: this.state.get (key) }));

            if (new URLSearchParams (location.search).get ("plugin") === "0")
                return;

            if (key.startsWith ("porridge:settings?"))
                this.answerSettings (key.slice ("porridge:settings?".length));

            if (key.startsWith ("porridge:host?"))
                this.answerHost (key.slice ("porridge:host?".length));

            if (key.startsWith ("porridge:library?"))
                this.answerLibrary (key.slice ("porridge:library?".length));
        }, 0);
    }
    // Stands in for the plugin's bank library (tools/clap/PorridgeLibrary.h), in memory for as long
    // as the page: every folder "holds" the bundled banks (presets/), so scanning any path finds them.
    async answerLibrary (request)
    {
        const lib = this.library ??= { banks: [], files: new Map(), parts: new Map() };
        const reply = value => this.stateListeners.forEach (f => f ({ key: "porridge:library", value }));
        const list = () => reply ({ banks: lib.banks });
        const toBase64 = bytes =>
        {
            let s = "";
            for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode (...bytes.subarray (i, i + 32768));
            return btoa (s);
        };
        const fromBase64 = s => Uint8Array.from (atob (s), c => c.charCodeAt (0));
        const hash = s => [...s].reduce ((h, c) => Math.imul (h ^ c.charCodeAt (0), 16777619) >>> 0, 2166136261).toString (16);

        if (request.startsWith ("scan="))
        {
            const found = [];
            for (const folder of JSON.parse (request.slice (5)))
                for (const name of ["vanilla.porridge", "oatmealprs.dat"])
                {
                    const id = "f" + hash (folder + "/" + name);
                    if (! lib.files.has (id))
                        lib.files.set (id, new Uint8Array (await (await fetch ("../../presets/" + name)).arrayBuffer()));
                    found.push ({ id, name: name.replace (/\.[^.]*$/, ""), origin: "folder", path: folder + "/" + name, folder,
                                  size: lib.files.get (id).length, modified: 1 });
                }
            lib.banks = [...found, ...lib.banks.filter (b => b.origin === "opened")];
            return list();
        }
        if (request.startsWith ("read="))
        {
            const { id, part } = JSON.parse (request.slice (5));
            const bytes = lib.files.get (id), size = 512 * 1024;
            if (! bytes) return reply ({ read: { id, error: "not in the library" } });
            const parts = Math.max (1, Math.ceil (bytes.length / size));
            return reply ({ read: { id, part, parts, data: toBase64 (bytes.subarray (part * size, (part + 1) * size)) } });
        }
        if (request.startsWith ("put="))
        {
            const { id, name, part, parts, data } = JSON.parse (request.slice (4));
            const got = [...(part === 0 ? [] : lib.parts.get (id) ?? []), fromBase64 (data)];
            lib.parts.set (id, got);
            if (part + 1 < parts) return;
            const bytes = new Uint8Array (got.reduce ((n, p) => n + p.length, 0));
            got.reduce ((at, p) => (bytes.set (p, at), at + p.length), 0);
            lib.parts.delete (id);
            lib.files.set (id, bytes);
            lib.banks = [...lib.banks.filter (b => b.id !== id), { id, name, origin: "opened", path: "", folder: "", size: bytes.length, modified: 1 }];
            return list();
        }
        if (request.startsWith ("remove="))
        {
            const id = request.slice (7);
            lib.banks = lib.banks.filter (b => ! (b.id === id && b.origin === "opened"));
            return list();
        }
        list();
    }
    // Stands in for the host's parameter menu: the requests are kept in hostMenus.
    answerHost (request)
    {
        this.hostMenus ??= [];

        if (request.startsWith ("menu="))
            this.hostMenus.push (JSON.parse (request.slice (5)));
        else if (request === "dismiss")
            this.hostMenus.push ("dismiss");
        else
            this.stateListeners.forEach (f => f ({ key: "porridge:host", value: { menu: true } }));
    }
    // Stands in for the CLAP plugin's settings bridge (tools/clap-patch.mjs): the "window"
    // is the #host element. ?plugin=0 leaves it out, as in cmaj play.
    answerSettings (request)
    {
        const host = document.getElementById ("host");
        let settings = {};
        try { settings = JSON.parse (localStorage.getItem ("porridge-settings") ?? "{}"); } catch {}
        if (request.startsWith ("zoom="))
        {
            const zoom = Math.min (3, Math.max (0.5, Number (request.slice (5)) || 1));
            Object.assign (host.style, { inset: "auto", left: "0", top: "0", width: `${1100 * zoom}px`, height: `${580 * zoom}px` });
        }
        if (request.startsWith ("save="))
        {
            settings = JSON.parse (request.slice (5));
            localStorage.setItem ("porridge-settings", JSON.stringify (settings));
        }
        const zoom = Math.min (host.clientWidth / 1100, host.clientHeight / 580);
        this.stateListeners.forEach (f => f ({ key: "porridge:settings", value: { settings, zoom } }));
    }
    sendStoredStateValue (key, v)   { this.state.set (key, v); this.stateListeners.forEach (f => f ({ key, value: v })); }
    requestFullStoredState (callback)
    {
        setTimeout (() => callback ({ parameters: [...this.params].map (([name, value]) => ({ name, value })),
                                      values: Object.fromEntries (this.state) }), 0);
    }
    addEndpointListener (id, fn)    { if (! this.endpointListeners.has (id)) this.endpointListeners.set (id, []); this.endpointListeners.get (id).push (fn); }
    removeEndpointListener() {}
    getResourceAddress (p)          { return "../../" + p.replace (/^\//, ""); }
    readResource (p)                { return fetch (this.getResourceAddress (p)); }
}

const pc = new MockPatchConnection();
window.pc = pc;
const worker = await import ("../../bundle/worker.js");
worker.default (pc);
const mod = await import ("../../bundle/view.js");
const view = mod.default (pc);
document.getElementById ("host").appendChild (view);
window.view = view;
const page = new URLSearchParams (location.search).get ("page");
if (page) setTimeout (() => view.showPage (page), 0);
</script>
</body>
</html>
